<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cronômetro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <div class="stopwatch-card">
        <h1>Cronômetro</h1>
        <div class="display" id="display" aria-live="polite">00:00.00</div>
        <div class="controls">
          <button id="startBtn" class="primary">Iniciar</button>
          <button id="pauseBtn">Pausar</button>
          <button id="resetBtn">Resetar</button>
          <button id="lapBtn">Voltas</button>
        </div>
        <div class="laps-wrap">
          <h2>Voltas</h2>
          <ul id="laps" class="laps"></ul>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
